name: Tests
on: 
  pull_request:
    branches:
    - main
    types: [assigned, opened, synchronize, reopened, ready_for_review]
    paths: 
    - .github/**
    - parallel-orch/**
    - overlay-sandbox/**
    - test/**
    - scripts/**
  push:
    branches:
    - main
    paths: 
    - parallel-orch/**
    - overlay-sandbox/**
    - test/**
    - scripts/**
  workflow_dispatch:
# Jobs section
jobs:
    PaSh-Spec-Tests:
      strategy:
        fail-fast: false
        matrix:
          os: 
          - ubuntu-20.04
      runs-on: ${{ matrix.os }}
      if: github.event.pull_request.draft == false
      steps:
      - uses: actions/checkout@v2 
      - name: Set up Python 3.11
        uses: actions/setup-python@v2
        with:
          python-version: '3.11'
      - name: Running Correctness Tests
        run: |
          sudo touch /.githubenv
          uname -a
          # install the system deps and pash the environment
          apt install python3 strace wget make file libtool lipcap2-bin mergerfs util-linux curl netcat-openbsd
          git submodule update --init --recursive
          cd deps/try
          bash setup.sh
          cd ../pash
          bash scripts/setup-pash.sh
          cd ../..
          # run all the tests
          export DEBUG=100
          export PASH_TOP="$PWD/deps/pash"
          export PATH=$PATH:$PASH_TOP
          bash test/test_orch.sh  
          # get the timer
          timer=$(LANG=en_us_88591; date)
          echo "VERSION<<EOF" >> $GITHUB_ENV
          echo "OS:${{matrix.os}}" >> $GITHUB_ENV
          echo "$timer" >> $GITHUB_ENV
          # Parse the results and construct a github message post
          # we append the data to the global env
          cat ./test/results/results.log >> $GITHUB_ENV
          echo 'EOF' >> $GITHUB_ENV
      - name: Comment on PR
        uses: actions/github-script@v3
        with:
          script: |
            let body = `${{ env.VERSION }}`
            console.log(context)
            // if we are directly pushing on main/future, we cannot push comments -> exit
            if (context.eventName === "push" && (context.ref === "refs/heads/main" || context.ref === "refs/heads/future")) {
              return 0;
            }
            github.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body,
            })     
      - name: Exit Code
        run: |
          # check if everything executed without errors
          cd ~/dynamic-parallelizer/test && bash exit_code.sh
